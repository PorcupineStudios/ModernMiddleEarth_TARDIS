modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "[6.0.10,)"
ordering = "AFTER"
side = "BOTH"

# Vehicles are Create: Aeronautics contraptions (Simulated assembles them, Offroad gives them wheels) on Sable physics.
[[dependencies.${mod_id}]]
modId = "aeronautics"
type = "required"
versionRange = "[1.3.2,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "offroad"
type = "required"
versionRange = "[1.3.2,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "sable"
type = "required"
versionRange = "[2.0.6,)"
ordering = "AFTER"
side = "BOTH"

# The harness steers the front Offroad wheel mounts of its vehicle (a wagon pole turning the front axle).
[[mixins]]
config = "ringbearer_harness.mixins.json"

[[dependencies.${mod_id}]]
modId = "curios"
type = "required"
versionRange = "[9.5.1,)"
ordering = "AFTER"
side = "BOTH"
