pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'RingBearer'

// api: the shared API both mods depend on. tardis and lotr never depend on each other.
// harness: hitching animals to Create: Aeronautics vehicles (needs Aeronautics); depends on neither mod.
include 'api', 'tardis', 'lotr', 'harness'
