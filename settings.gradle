pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'RingBearer'

// api: the shared API both mods depend on. tardis and lotr never depend on each other.
include 'api', 'tardis', 'lotr'
