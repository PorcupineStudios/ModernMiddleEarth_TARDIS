modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ringbearer_api"
type = "required"
versionRange = "[0.1.0,)"
ordering = "AFTER"
side = "BOTH"

# JEI is optional: with it installed, compat/jei/LotrJeiPlugin shows faction tables and LOTR's machines.
[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "[19.0,)"
ordering = "NONE"
side = "CLIENT"

# Jade is optional: with it installed, compat/jade/LotrJadePlugin shows what a set-down drink holds.
[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "[15.0,)"
ordering = "NONE"
side = "CLIENT"

# Middle-earth's chunks are filled only up to where its terrain can reach (world/map/NoiseTop).
[[mixins]]
config = "lotr_port.mixins.json"

# Shader packs (Iris): LOTR's plants, leaves and saplings take their vanilla counterpart's block id, so packs wave
# them in the wind (mixin/iris/IrisBlockIdMixin). Not required: it applies only when Iris is installed.
[[mixins]]
config = "lotr_port.iris.mixins.json"

# The film music is its own resource-only mod, lotr_port_music (built from the private repo PorcupineStudios/LOTR_music,
# lotr/docs/music.md). Its assets/lotr_port/ sounds, playlists and track titles merge into LotrMusic like any pack's,
# so it needs no rebuild when this mod changes. Without it the mod runs with no soundtrack. Any 1.x works.
[[dependencies.${mod_id}]]
modId = "lotr_port_music"
type = "optional"
versionRange = "[1.0,2.0)"
ordering = "NONE"
side = "CLIENT"
