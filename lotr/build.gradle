plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/mod.gradle')

evaluationDependsOn(':api')

// JEI (optional at runtime): compiled against its API, and loaded in dev runs so the plugin can be seen.
repositories {
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
}

// Curios (required): worn-item slots. The ring slot holds the One Ring and LOTR's rings (`ring/`, data
// `curios/slots`, `curios/entities`, item tag `curios:ring`). Compiled against its API; dev runs load the full jar.
dependencies {
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
}

// Iris + Sodium (optional, dev runs only with -Piris): checks compat/iris and the looks drawn over a shader pack.
// Put a pack in run/shaderpacks and name it in run/config/iris.properties (shaderPack=..., enableShaders=true).
if (project.hasProperty('iris')) {
    dependencies {
        runtimeOnly "maven.modrinth:iris:${iris_version}"
        runtimeOnly "maven.modrinth:sodium:${sodium_version}"
    }
}

// Create (optional): compat/create (a mechanical crafter per faction) compiles against it. Dev runs and the GameTest
// server load it only with -PwithCreate (the CI test server runs without Create, as players without it would). Its
// Registrate, Flywheel and Ponder are jar-in-jar, unpacked for the compiler as in tardis/build.gradle.
def createJar = configurations.detachedConfiguration(dependencies.create("maven.modrinth:create:${create_version}"))
createJar.transitive = false
def unpackCreateLibs = tasks.register('unpackCreateLibs', Copy) {
    from({ zipTree(createJar.singleFile).matching { include 'META-INF/jarjar/*.jar' } })
    into layout.buildDirectory.dir('create-libs')
    eachFile { path = name }
    includeEmptyDirs = false
}
dependencies {
    compileOnly "maven.modrinth:create:${create_version}"
    if (project.hasProperty('withCreate')) {
        runtimeOnly "maven.modrinth:create:${create_version}"
    }
    compileOnly fileTree(layout.buildDirectory.dir('create-libs')) {
        include '*.jar'
        builtBy unpackCreateLibs
    }
}

// Jade (optional): compat/jade shows what a set-down drink holds. Compile only.
dependencies {
    compileOnly "maven.modrinth:jade:${jade_version}"
}

dependencies {
    implementation project(':api')
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

// Dev runs load the shared API next to this mod.
neoForge {
    mods {
        ringbearer_api {
            sourceSet(project(':api').sourceSets.main)
        }
    }
}
