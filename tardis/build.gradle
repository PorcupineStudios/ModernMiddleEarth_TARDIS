plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/mod.gradle')

evaluationDependsOn(':api')

// Create is the TARDIS's one hard dependency (the winder, Create-made repair parts). It comes from Modrinth's maven,
// since Create's own maven (maven.createmod.net) had an expired certificate (2026-11-03). Modrinth's jar carries
// Ponder, Flywheel and Registrate inside (jar-in-jar): the game loads them from there, and the compiler gets them
// unpacked by unpackCreateLibs.
repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

def createJar = configurations.detachedConfiguration(dependencies.create("maven.modrinth:create:${create_version}"))
createJar.transitive = false

def unpackCreateLibs = tasks.register('unpackCreateLibs', Copy) {
    from({ zipTree(createJar.singleFile).matching { include 'META-INF/jarjar/*.jar' } })
    into layout.buildDirectory.dir('create-libs')
    eachFile { path = name }
    includeEmptyDirs = false
}

// Immersive Portals (required, Aaron 2026-11-03): the see-through TARDIS door and seamless space. Its NeoForge build is
// one "-all" jar (imm_ptl_core, q_misc_util); it needs Cloth Config at runtime.
dependencies {
    implementation "maven.modrinth:immersive-portals-neoforge:${immersive_portals_version}"
    runtimeOnly "maven.modrinth:cloth-config:${cloth_config_version}"
}

dependencies {
    implementation project(':api')
    implementation "maven.modrinth:create:${create_version}"
    compileOnly fileTree(layout.buildDirectory.dir('create-libs')) {
        include '*.jar'
        builtBy unpackCreateLibs
    }
}

// Dev runs load the shared API next to this mod.
neoForge {
    mods {
        ringbearer_api {
            sourceSet(project(':api').sourceSets.main)
        }
    }
}
