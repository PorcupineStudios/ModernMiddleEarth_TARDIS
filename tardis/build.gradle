plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/mod.gradle')

evaluationDependsOn(':api')

// Create is the TARDIS's one hard dependency (the winder, Create-made repair parts). It comes from Modrinth's maven,
// since Create's own maven (maven.createmod.net) had an expired certificate (2026-11-03). Modrinth's jar carries
// Ponder, Flywheel and Registrate inside (jar-in-jar): the game loads them from there, and the compiler gets them
// unpacked by unpackCreateLibs.
repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

def createJar = configurations.detachedConfiguration(dependencies.create("maven.modrinth:create:${create_version}"))
createJar.transitive = false

def unpackCreateLibs = tasks.register('unpackCreateLibs', Copy) {
    from({ zipTree(createJar.singleFile).matching { include 'META-INF/jarjar/*.jar' } })
    into layout.buildDirectory.dir('create-libs')
    eachFile { path = name }
    includeEmptyDirs = false
}

// Immersive Portals (required, Aaron 2026-11-03): the see-through TARDIS door and seamless space. Its NeoForge build is
// one "-all" jar (imm_ptl_core, q_misc_util); it needs Cloth Config at runtime.
dependencies {
    implementation "maven.modrinth:immersive-portals-neoforge:${immersive_portals_version}"
    runtimeOnly "maven.modrinth:cloth-config:${cloth_config_version}"
}

// Jade (optional): our plugin in compat/jade names the console control you look at. Compile only; the test-build
// release carries its jar for the test instance.
dependencies {
    compileOnly "maven.modrinth:jade:${jade_version}"
}

dependencies {
    implementation project(':api')
    implementation "maven.modrinth:create:${create_version}"
    compileOnly fileTree(layout.buildDirectory.dir('create-libs')) {
        include '*.jar'
        builtBy unpackCreateLibs
    }
}

// Dev runs load the shared API next to this mod.
neoForge {
    mods {
        ringbearer_api {
            sourceSet(project(':api').sourceSets.main)
        }
    }
}


// Create: Aeronautics + Sable (optional, Aaron 2026-11-15): ships/sub-levels. Compile against them; dev runs load them
// only with -Paeronautics; players install them themselves. Like Create, their real code is jar-in-jar, unpacked for the compiler.
def aeroJars = configurations.detachedConfiguration(
        dependencies.create("maven.modrinth:create-aeronautics:${aeronautics_version}"),
        dependencies.create("maven.modrinth:sable:${sable_version}"))
aeroJars.transitive = false

def unpackAeroLibs = tasks.register('unpackAeroLibs', Copy) {
    from({ aeroJars.files.collect { zipTree(it).matching { include 'META-INF/jarjar/*.jar' } } })
    into layout.buildDirectory.dir('aero-libs')
    eachFile { path = name }
    includeEmptyDirs = false
}

dependencies {
    compileOnly "maven.modrinth:sable:${sable_version}"
    // shortcut: off by default, Sable 2.0.6 crashes next to Immersive Portals (both redirect Entity collision); -Paeronautics to load them
    if (project.hasProperty("aeronautics")) {
        runtimeOnly "maven.modrinth:create-aeronautics:${aeronautics_version}"
        runtimeOnly "maven.modrinth:sable:${sable_version}"
    }
    compileOnly fileTree(layout.buildDirectory.dir('aero-libs')) {
        include '*.jar'
        builtBy unpackAeroLibs
    }
}
