modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ringbearer_api"
type = "required"
versionRange = "[0.1.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "[6.0.10,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "immersive_portals_core"
type = "required"
versionRange = "[6.0.7,)"
ordering = "AFTER"
side = "BOTH"

# Six-direction gravity: Gravity Changer's mixins, ported (gravity/gc, see its NOTICE).
[[mixins]]
config = "tardis_rb.mixins.json"

# Fast space flight loads no chunks through Immersive Portals either (compat/immportals).
[[mixins]]
config = "tardis_rb.immportals.mixins.json"
