name = "ringbearer-bugs"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[vars]
REPO = "PorcupineStudios/ModernMiddleEarth_TARDIS"
LABELS = "bug,from-game"
# added to reports sent with the admin key: the scheduled Claude run works from-game issues only when labelled valid
ADMIN_LABELS = "valid"
DAILY_LIMIT_PER_IP = "10"
# our mods: each report gets a label "<mod id> <version>" per mod it ran with, to filter tickets by version
VERSION_MODS = "ringbearer_api,tardis_rb,lotr_port,ringbearer_harness"

# Create with `npx wrangler kv namespace create ATTACH` and paste the id it prints here.
[[kv_namespaces]]
binding = "ATTACH"
id = "401325f9a1e84d95a66524567256cf42"

# GITHUB_TOKEN is a secret: `npx wrangler secret put GITHUB_TOKEN` (never in this file).
