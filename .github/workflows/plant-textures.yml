name: Plant textures

# converter/plant_textures.py with the LOTR jar (2026-11-25): re-copies every LOTR plant's textures (overlays included)
# and rewrites its models. Runs when the step or this file changes. The jar is taken from the private RingRealms repo
# (secret RINGREALMS_TOKEN, as "Convert LOTR") and deleted before the commit. We have no rights to LOTR's files
# (lotr/CLAUDE.md): converter/LegacyAssetMap.java then lists every texture that is LOTR's (read from the player's jar
# at run time) and gitignores it, so only models, the lists and our own pictures are committed.
on:
  push:
    paths:
      - converter/plant_textures.py
      - .github/workflows/plant-textures.yml

permissions:
  contents: write

jobs:
  textures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: LOTR jar from RingRealms
        uses: actions/checkout@v4
        with:
          repository: PorcupineStudios/RingRealms
          token: ${{ secrets.RINGREALMS_TOKEN }}
          path: ringrealms
          sparse-checkout: libs
      - name: Check the token for the LOTR export
        env:
          TOKEN: ${{ secrets.LOTR_EXPORT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ] || ! curl -sf -H "Authorization: Bearer $TOKEN" \
              https://api.github.com/repos/PorcupineStudios/LOTR_export > /dev/null; then
            echo "::error::LOTR_EXPORT_TOKEN is missing or expired. Save a fine-grained token with read and write access to PorcupineStudios/LOTR_export contents as the repository secret LOTR_EXPORT_TOKEN, then run this again."
            exit 1
          fi
      - name: LOTR export from its private repo
        # plant_textures.py reads the export (blocks.json); it is LOTR's data, so it lives in PorcupineStudios/LOTR_export
        uses: actions/checkout@v4
        with:
          repository: PorcupineStudios/LOTR_export
          token: ${{ secrets.LOTR_EXPORT_TOKEN }}
          path: converter/export
      - name: Plant textures and models, then list LOTR's files
        run: |
          mkdir -p converter/libs
          cp "ringrealms/libs/LOTRMod v36.15.jar" converter/libs/
          rm -rf ringrealms
          pip install --quiet pillow
          python3 converter/plant_textures.py
          ./gradlew :lotr:compileJava --stacktrace
          java -cp lotr/build/classes/java/main converter/LegacyAssetMap.java "converter/libs/LOTRMod v36.15.jar"
          rm -rf converter/libs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotr/src/generated/resources lotr/src/main/resources/lotr_port_legacy_assets.tsv \
            lotr/src/main/resources/lotr_port_legacy_composites.tsv
          if [ -n "$(git ls-files -ci --exclude-standard)" ]; then echo "::error::LOTR's files would be committed"; exit 1; fi
          if git diff --cached --quiet; then echo "plants unchanged"; exit 0; fi
          git commit -m "Plant models from the LOTR jar (converter/plant_textures.py)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
