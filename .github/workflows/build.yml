name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --stacktrace
      - name: GameTests
        # The game test server can exit 0 after a mod loading crash, so the log has to say the tests passed.
        run: |
          ./gradlew :lotr:runGameTestServer --stacktrace 2>&1 | tee gametest.log
          grep -E "All [0-9]+ required tests passed" gametest.log
      - name: Middle-earth world
        # A new world of the Middle-earth world type on a dedicated server: WorldCheck logs the spawn and stops it.
        timeout-minutes: 15
        run: |
          mkdir -p lotr/run
          echo "eula=true" > lotr/run/eula.txt
          printf 'level-type=lotr_port\\:middle_earth\nonline-mode=false\nlevel-name=middle-earth-check\n' > lotr/run/server.properties
          cat lotr/run/server.properties
          JAVA_TOOL_OPTIONS=-Dlotr_port.worldcheck=true ./gradlew :lotr:runServer --stacktrace 2>&1 | tee worldcheck.log
          grep -E "\\[worldcheck\\]|WORLDCHECK" worldcheck.log
          grep "WORLDCHECK PASSED" worldcheck.log
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: "*/build/libs/*.jar"
