name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --stacktrace
      - name: GameTests
        # The game test server can exit 0 after a mod loading crash, so the log has to say the tests passed.
        run: |
          ./gradlew :lotr:runGameTestServer --stacktrace 2>&1 | tee gametest.log
          grep -E "All [0-9]+ required tests passed" gametest.log
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: "*/build/libs/*.jar"
