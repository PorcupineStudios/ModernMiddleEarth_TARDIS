name: Build

# THROWAWAY (misty-preview only): generates the Misty Mountains round Caradhras, writes TerrainPreview's relief/variants/stats,
# then flies the real client over the saved world for aerial shots, and pushes it all to claude/terrain-shots-tmp.
on:
  push:
    branches: ['claude/misty-preview']

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri libglu1-mesa && pip install nbtlib
      - name: Generate and preview
        timeout-minutes: 25
        run: |
          mkdir -p lotr/run
          echo "eula=true" > lotr/run/eula.txt
          printf 'level-type=lotr_port\\:middle_earth\nonline-mode=false\nlevel-name=misty\nmax-tick-time=-1\n' > lotr/run/server.properties
          JAVA_TOOL_OPTIONS="-Dlotr_port.terrainpreview=45632,14400,768 -Dlotr_port.terrainpreview.save=true -Xmx6g" ./gradlew :lotr:runServer --stacktrace > preview.log 2>&1 || true
          grep -E "\[preview\]|ERROR|Exception" preview.log | head -20 || true
          cat lotr/run/terrain_preview/stats.txt
      - name: Aerial shots
        timeout-minutes: 25
        run: |
          mkdir -p lotr/run/saves && cp -r lotr/run/misty lotr/run/saves/misty && rm -f lotr/run/saves/misty/session.lock
          python3 .github/shot/shire_client.py lotr/run
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 3
          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 JAVA_TOOL_OPTIONS="-Dlotr_port.devscript=aerial.txt" timeout 1300 ./gradlew :lotr:runClient -PquickPlay=misty > client.log 2>&1 || true
          ls -la lotr/run/screenshots || true
          grep -iE "devscript|exception" client.log | head -20 || true
      - name: Keep the results on a throwaway branch
        if: always()
        run: |
          mkdir -p out && cp lotr/run/terrain_preview/* out/ 2>/dev/null; cp lotr/run/screenshots/*.png out/ 2>/dev/null; tail -200 client.log > out/client-tail.log 2>/dev/null; grep -E "\[preview\]|ERROR|Exception" preview.log | head -50 > out/preview-errors.log || true
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout -q --orphan shots-tmp
          git rm -rf -q --cached .
          git add -f out
          git commit -q -m "terrain shots (throwaway)"
          git push -f -q origin HEAD:refs/heads/claude/terrain-shots-tmp
