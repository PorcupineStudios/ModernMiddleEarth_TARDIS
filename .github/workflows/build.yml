name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe Create mavens (temporary)
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -w "http %{http_code} %{redirect_url}\n" http://maven.createmod.net/com/simibubi/create/create-1.21.1/maven-metadata.xml || true
          curl -sS http://maven.createmod.net/com/simibubi/create/create-1.21.1/maven-metadata.xml | tail -6 || true
          curl -sS http://maven.createmod.net/net/createmod/ponder/ponder-neoforge/maven-metadata.xml | tail -6 || true
          curl -sS -o /dev/null -w "ithundxr %{http_code}\n" https://maven.ithundxr.dev/snapshots/com/tterrag/registrate/Registrate/maven-metadata.xml || true
          for p in flywheel ponder; do
            curl -sS "https://api.modrinth.com/v2/project/$p/version?game_versions=%5B%221.21.1%22%5D" | python3 -c "import json,sys; [print('$p', v['version_number'], v['loaders'], [f['filename'] for f in v['files']]) for v in json.load(sys.stdin)[:4]]" || true
          done
          exit 1
      - run: ./gradlew build --stacktrace
      - name: GameTests
        # The game test server can exit 0 after a mod loading crash, so the log has to say the tests passed.
        run: |
          ./gradlew :lotr:runGameTestServer --stacktrace 2>&1 | tee gametest.log
          grep -E "All [0-9]+ required tests passed" gametest.log
      - name: TARDIS GameTests
        run: |
          ./gradlew :tardis:runGameTestServer --stacktrace 2>&1 | tee tardis-gametest.log
          grep -E "All [0-9]+ required tests passed" tardis-gametest.log
      - name: Middle-earth world
        # A new world of the Middle-earth world type on a dedicated server: WorldCheck logs the spawn and stops it.
        # It generates ~160 far-apart chunks plus two structures in one tick: watchdog off (max-tick-time=-1), 6 GB heap.
        timeout-minutes: 15
        run: |
          mkdir -p lotr/run
          echo "eula=true" > lotr/run/eula.txt
          printf 'level-type=lotr_port\\:middle_earth\nonline-mode=false\nlevel-name=middle-earth-check\nmax-tick-time=-1\n' > lotr/run/server.properties
          cat lotr/run/server.properties
          JAVA_TOOL_OPTIONS="-Dlotr_port.worldcheck=true -Xmx6g" ./gradlew :lotr:runServer --stacktrace 2>&1 | tee worldcheck.log
          grep -E "\\[worldcheck\\]|WORLDCHECK" worldcheck.log
          grep "WORLDCHECK PASSED" worldcheck.log
      - name: TARDIS world
        # A dedicated server: the crash site, its police box, and its interior in the interior dimension.
        timeout-minutes: 10
        run: |
          mkdir -p tardis/run
          echo "eula=true" > tardis/run/eula.txt
          printf 'online-mode=false\nlevel-name=tardis-check\n' > tardis/run/server.properties
          JAVA_TOOL_OPTIONS="-Dtardis_rb.worldcheck=true" ./gradlew :tardis:runServer --stacktrace 2>&1 | tee tardis-world.log
          grep -E "\\[worldcheck\\]|WORLDCHECK|crash site" tardis-world.log
          grep "TARDIS WORLDCHECK PASSED" tardis-world.log
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: "*/build/libs/*.jar"
