name: Build

# THROWAWAY (vortex-smooth-shot only): a smooth recording of the time vortex from the real client. The game runs at
# 1 tick/s (20x slow) so the software renderer's few frames a second each cover 1/20 as much vortex time; the video is
# then sped back up 20x to real speed. Never merge this file.
on:
  push:
    branches: ['claude/vortex-smooth-shot']

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri libglu1-mesa ffmpeg && pip install nbtlib
      - name: A world
        timeout-minutes: 12
        run: |
          mkdir -p tardis/run
          echo "eula=true" > tardis/run/eula.txt
          printf 'online-mode=false\nlevel-name=tardis-check\n' > tardis/run/server.properties
          JAVA_TOOL_OPTIONS="-Dtardis_rb.worldcheck=true" ./gradlew :tardis:runServer --stacktrace 2>&1 | tail -3
          mkdir -p tardis/run/saves && cp -r tardis/run/tardis-check tardis/run/saves/shot && rm -f tardis/run/saves/shot/session.lock
          python3 .github/shot/prepare.py tardis/run
      - name: Record the vortex
        timeout-minutes: 30
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 3
          (DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 ./gradlew :tardis:runClient -PquickPlay=shot > client.log 2>&1 &)
          for i in $(seq 1 240); do grep -q "SHOT_READY" client.log && break; sleep 5; done
          sleep 30
          mkdir -p shots
          # 8 s of vortex time = 160 s of wall time at 1 tick/s; every frame the renderer makes is caught at 20/s
          ffmpeg -loglevel error -f x11grab -framerate 20 -video_size 854x480 -i :99.0+213,120 -t 160 -c:v libx264 -preset veryfast -crf 12 shots/raw.mkv
          ffprobe -v error -count_frames -show_entries stream=nb_read_frames -of csv=p=0 shots/raw.mkv
          # how many different frames the renderer actually made
          ffmpeg -loglevel error -i shots/raw.mkv -vf mpdecimate -f null - -stats 2>&1 | tail -1 || true
          # back to real speed: 20x faster, 60 fps video, 30 fps GIF
          ffmpeg -loglevel error -i shots/raw.mkv -vf "setpts=PTS/20,fps=60" -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p shots/vortex_smooth.mp4
          ffmpeg -loglevel error -i shots/raw.mkv -vf "setpts=PTS/20,fps=30,scale=640:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=256[p];[b][p]paletteuse=dither=sierra2_4a" shots/vortex_smooth.gif
          ls -la shots
      - name: Keep the shots on a throwaway branch
        if: always()
        run: |
          tail -300 client.log > client-tail.log || true
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout -q --orphan shots-tmp
          git rm -rf -q --cached .
          cp shots/vortex_smooth.* . 2>/dev/null || true
          git add -f vortex_smooth.* client-tail.log 2>/dev/null || true
          git commit -q -m "vortex smooth (throwaway)"
          git push -f -q origin HEAD:refs/heads/claude/vortex-shots-tmp
