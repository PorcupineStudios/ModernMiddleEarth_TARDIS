name: Build

# THROWAWAY (worldcheck-dump only): runs the Middle-earth world check with thread dumps every 60 s after 4 minutes,
# and pushes the log and dumps to claude/terrain-shots-tmp.
on:
  push:
    branches: ['claude/worldcheck-dump']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Middle-earth world with dumps
        timeout-minutes: 30
        run: |
          mkdir -p lotr/run out
          echo "eula=true" > lotr/run/eula.txt
          printf 'level-type=lotr_port\\:middle_earth\nonline-mode=false\nlevel-name=middle-earth-check\nmax-tick-time=-1\nlevel-seed=-642785164712710613\n' > lotr/run/server.properties
          (sleep 240; for i in $(seq 1 18); do for p in $(jps -l | grep -v -i "gradle\|jps" | awk '{print $1}'); do jcmd $p Thread.print > out/dump_${i}_$p.txt 2>&1; done; sleep 60; done) &
          (JAVA_TOOL_OPTIONS="-Dlotr_port.worldcheck=true -Xmx6g" timeout 1500 ./gradlew :lotr:runServer --stacktrace > out/worldcheck.log 2>&1 || true)
          grep -E "\[worldcheck\]|WORLDCHECK" out/worldcheck.log | tail -30 || true
      - name: Push results
        if: always()
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout -q --orphan shots-tmp
          git rm -rf -q --cached .
          git add -f out
          git commit -q -m "worldcheck dumps (throwaway)"
          git push -f -q origin HEAD:refs/heads/claude/terrain-shots-tmp
