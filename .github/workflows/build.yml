name: Build

# THROWAWAY (treecheck-repro only): the Middle-earth world check with one seed, on the code with the noise cuts and
# on the code before them, to see whether the cuts lose tree leaves.
on:
  push:
    branches: ['claude/treecheck-repro']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ref: [claude/reeds-lakes-shire, 035d39cd0a0a1f856c276a438dc06ca5f0f382de]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Middle-earth world, seed 7866868388345729068
        timeout-minutes: 30
        run: |
          mkdir -p lotr/run
          echo "eula=true" > lotr/run/eula.txt
          printf 'level-type=lotr_port\\:middle_earth\nonline-mode=false\nlevel-name=middle-earth-check\nmax-tick-time=-1\nlevel-seed=7866868388345729068\n' > lotr/run/server.properties
          JAVA_TOOL_OPTIONS="-Dlotr_port.worldcheck=true -Xmx10g" ./gradlew :lotr:runServer > worldcheck.log 2>&1 || true
          grep -E "\[worldcheck\] (seed|generated|trees)|WORLDCHECK" worldcheck.log | cut -c1-600
