name: Build

# THROWAWAY (bench-heights only): times generating the same lowland (Shire) and mountain (Misty Mountains) squares
# with the code before the noise cuts at y 640, and with the cuts at 640, 448 and 320; peak server memory too.
on:
  push:
    branches: ['claude/bench-heights']

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: before640, ref: 035d39cd0a0a1f856c276a438dc06ca5f0f382de, top: 640}
          - {name: cut640, ref: claude/reeds-lakes-shire, top: 640}
          - {name: cut448, ref: claude/reeds-lakes-shire, top: 448}
          - {name: cut320, ref: claude/reeds-lakes-shire, top: 320}
    steps:
      - uses: actions/checkout@v4
        with:
          path: bench
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: code
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Heights
        working-directory: code
        run: |
          if [ "${{ matrix.top }}" != "640" ]; then python3 ../bench/.github/bench/height.py ${{ matrix.top }}; fi
          ./gradlew :lotr:compileJava -q
      - name: Generate
        working-directory: code
        timeout-minutes: 40
        run: |
          mkdir -p lotr/run ../out
          echo "eula=true" > lotr/run/eula.txt
          for spot in shire:0,0 misty:51000,6500 shire2:2048,0; do
            name=${spot%%:*}; at=${spot#*:}
            printf "level-type=lotr_port\\\\:middle_earth\nonline-mode=false\nlevel-name=$name\nmax-tick-time=-1\nlevel-seed=12345\n" > lotr/run/server.properties
            rm -rf lotr/run/terrain_preview
            (while true; do ps -C java -o rss= | sort -n | tail -1; sleep 1; done) > ../out/rss_$name.txt &
            sampler=$!
            JAVA_TOOL_OPTIONS="-Dlotr_port.terrainpreview=$at,512 -Xmx8g" ./gradlew :lotr:runServer > ../out/log_$name.txt 2>&1 || true
            kill $sampler
            cp lotr/run/terrain_preview/stats.txt ../out/stats_$name.txt || true
            echo "$name: $(grep took ../out/stats_$name.txt) peak rss $(sort -n ../out/rss_$name.txt | tail -1) kB"
          done
      - name: Keep the results
        if: always()
        working-directory: code
        run: |
          for f in ../out/log_*.txt; do grep -E "\[preview\]|Exception|ERROR" $f | grep -v "Invalid path" | head -20 > $f.short; rm $f; done
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout -q --orphan bench-out
          git rm -rf -q --cached .
          rm -rf out && cp -r ../out out
          git add -f out
          git commit -q -m "bench ${{ matrix.name }} (throwaway)"
          git push -f -q origin HEAD:refs/heads/claude/bench-out-${{ matrix.name }}
