name: Convert LOTR

# Runs the 1.7.10 exporter (converter/) in a real LOTR 36.15 client under a virtual screen and commits what it reads
# to the private repo PorcupineStudios/LOTR_export (checked out at converter/export/; we have no rights to publish
# LOTR's data, lotr/CLAUDE.md). Only by hand from the Actions tab (Aaron 2026-11-18): the converter builds the mods
# from the export, so pushes never need it ("rates" measures how often LOTR's structures stand in its real Middle-earth
# instead: structure_rates.json).
on:
  workflow_dispatch:
    inputs:
      rates:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            25
      - uses: gradle/actions/setup-gradle@v4
      # The LOTR mod's jar is not in this public repo: take it from the private RingRealms repo. Needs the secret
      # RINGREALMS_TOKEN (a fine-grained token with read access to PorcupineStudios/RingRealms contents).
      - name: Check the token for the LOTR jar
        env:
          TOKEN: ${{ secrets.RINGREALMS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ] || ! curl -sf -H "Authorization: Bearer $TOKEN" \
              https://api.github.com/repos/PorcupineStudios/RingRealms > /dev/null; then
            echo "::error::RINGREALMS_TOKEN is missing or expired. Save a fine-grained token with read access to PorcupineStudios/RingRealms contents as the repository secret RINGREALMS_TOKEN, then run this again."
            exit 1
          fi
      - name: LOTR jar from RingRealms
        uses: actions/checkout@v4
        with:
          repository: PorcupineStudios/RingRealms
          token: ${{ secrets.RINGREALMS_TOKEN }}
          path: ringrealms
          sparse-checkout: libs
      - name: Put the LOTR jar where the converter reads it
        run: |
          mkdir -p converter/libs
          cp "ringrealms/libs/LOTRMod v36.15.jar" converter/libs/
          rm -rf ringrealms
      # The export is LOTR's data, so it lives in the private PorcupineStudios/LOTR_export, not here. Needs the secret
      # LOTR_EXPORT_TOKEN (a fine-grained token with read and write access to that repo's contents).
      - name: Export repo
        uses: actions/checkout@v4
        with:
          repository: PorcupineStudios/LOTR_export
          token: ${{ secrets.LOTR_EXPORT_TOKEN }}
          path: converter/export
      - name: Virtual screen
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb x11-xserver-utils libgl1-mesa-dri libglu1-mesa
      - name: Run the exporter
        working-directory: converter
        env:
          JAVA_TOOL_OPTIONS: -Dlotrexport.run=true -Dlotrexport.out=${{ github.workspace }}/converter/export -Dlotrexport.rates=${{ inputs.rates == true }}
        run: xvfb-run -a -s "-screen 0 1280x800x24 +extension RANDR +extension GLX" sh ./gradlew runClient --stacktrace
      - name: Check the export
        run: |
          ls -la converter/export && test -s converter/export/blocks.json && cat converter/export/errors.json | head -50
          grep -h "lotrexport\]" converter/run/client/logs/latest.log | tail -5 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export
          # logs only: artifacts of a public repo are public, and the export is LOTR's data
          path: converter/run/client/logs/
      - name: Commit the export to its private repo
        working-directory: converter/export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "export unchanged"; exit 0; fi
          git commit -m "Update the LOTR export (from $GITHUB_REPOSITORY $GITHUB_REF_NAME)"
          git push origin HEAD:main
