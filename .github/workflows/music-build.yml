name: Private music build

# Packs the Middle-earth film music into its own resource-only mod, lotr_port_music-<version>.jar, and puts it in a
# release of the PRIVATE repo PorcupineStudios/LOTR_music. Nothing with music in it is ever stored in this public repo
# (lotr/docs/music.md). lotr_port itself no longer contains music: it loads the tracks from this mod when it is
# installed, so run this only when the music changes, not for every lotr_port build.
#
# Why this is safe in a public repo:
# - Only "Run workflow" starts it, which needs write access here. Pull requests (forks) never run it and never see
#   the secret.
# - The secret MUSIC_TOKEN is a fine-grained token that can reach only LOTR_music (Contents: read and write).
# - No artifact upload, no release here, no cache: the jar leaves only through the private release.
# - No step lists the music files, so the public log shows no track names.
#
# Setup (once): Settings > Secrets and variables > Actions > New repository secret, name MUSIC_TOKEN.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of the music mod (lotr_port accepts any 1.x)
        default: 1.0.0
        required: true
      music_ref:
        description: Branch or commit of LOTR_music to pack
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: music-build
  cancel-in-progress: false

jobs:
  music-build:
    if: github.repository == 'PorcupineStudios/ModernMiddleEarth_TARDIS' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Token present
        env:
          MUSIC_TOKEN: ${{ secrets.MUSIC_TOKEN }}
        run: |
          if [ -z "$MUSIC_TOKEN" ]; then echo "::error::Add the MUSIC_TOKEN secret first (see the top of this file)"; exit 1; fi
      - name: Version is sane
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^1\.[0-9]+(\.[0-9]+)?$' \
            || { echo "::error::version must be 1.x or 1.x.y (lotr_port accepts [1.0,2.0))"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: music-mod
      - name: Music (private repo)
        uses: actions/checkout@v4
        with:
          repository: PorcupineStudios/LOTR_music
          ref: ${{ inputs.music_ref }}
          token: ${{ secrets.MUSIC_TOKEN }}
          path: music
          persist-credentials: false
      - name: Pack lotr_port_music
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test -f music/pack.mcmeta && test -f music/assets/lotr_port/sounds.json
          mkdir -p stage/META-INF out
          cp -r music/assets music/pack.mcmeta stage/
          sed "s/\${version}/${VERSION}/" music-mod/META-INF/neoforge.mods.toml > stage/META-INF/neoforge.mods.toml
          printf 'Manifest-Version: 1.0\nImplementation-Title: lotr_port_music\nImplementation-Version: %s\n' \
            "$VERSION" > stage/META-INF/MANIFEST.MF
          JAR="$PWD/out/lotr_port_music-${VERSION}.jar"
          # .ogg is already compressed: store it as is, deflate the rest
          cd stage
          zip -q -r -9 "$JAR" . -x '*.ogg'
          zip -q -r -0 "$JAR" . -i '*.ogg'
          cd ..
          ls -l out
      - name: Put the jar in the private LOTR_music release
        env:
          GH_TOKEN: ${{ secrets.MUSIC_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          R=PorcupineStudios/LOTR_music
          SHA=$(git -C music rev-parse HEAD)
          NOTES="Music mod lotr_port_music ${VERSION} (LOTR_music ${SHA}). Put it in mods/ next to any lotr_port build: it does not need rebuilding when lotr_port changes. Private: never share this jar."
          gh release view music-build -R "$R" >/dev/null 2>&1 \
            || gh release create music-build -R "$R" --title "Middle-earth Music mod" --notes "$NOTES"
          gh release upload music-build "out/lotr_port_music-${VERSION}.jar" -R "$R" --clobber
          gh release edit music-build -R "$R" --title "Middle-earth Music mod" --notes "$NOTES"
      - name: Clean up
        if: always()
        run: rm -rf out stage music
